[package]
name = "couch"
version = "0.2.0-preview.17"
edition = "2021"
publish = false

[lib]
name = "couch"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
cc = "1"

[dependencies]
tauri = { version = "=2.11.5", features = ["macos-private-api"] }
tauri-plugin-shell = "=2.3.6"
tauri-plugin-single-instance = "=2.4.4"
tauri-plugin-log = "=2.9.1"
tauri-plugin-dialog = "=2.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync", "time", "macros", "process", "process"] }
tauri-plugin-updater = "=2.11.0"
minisign-verify = "=0.2.5"
base64 = "0.22"
sha2 = "0.10"
semver = "1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
time = { version = "0.3", features = ["parsing"] }
tauri-plugin-window-state = "=2.4.0"
flate2 = "=1.1.10"
tar = "=0.4.46"
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-video = { path = "vendor/tauri-plugin-video", default-features = false, features = ["mpv-runtime"] }
objc2 = "=0.6.4"
objc2-core-bluetooth = { version = "=0.3.2", default-features = false, features = ["CBManager"] }
objc2-foundation = { version = "=0.3.2", features = ["NSArray", "NSDate", "NSRunLoop", "NSString"] }
objc2-io-bluetooth = { version = "=0.3.2", features = ["Bluetooth", "IOBluetoothDevice", "IOBluetoothDeviceInquiry", "IOBluetoothDevicePair", "IOBluetoothHostController"] }

[target.'cfg(target_os = "windows")'.dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-video = { path = "vendor/tauri-plugin-video", default-features = false, features = ["mpv-runtime"] }
windows = { version = "=0.61.3", features = ["Win32_Devices_Bluetooth", "Win32_Devices_FunctionDiscovery", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Devices_Bluetooth", "Devices_Enumeration", "Devices_Radios", "Foundation"] }
windows-collections = "=0.2.0"

[target.'cfg(target_os = "linux")'.dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
dbus = "0.9"
libloading = "=0.7.4"
bluer = { version = "=0.17.4", features = ["bluetoothd"] }
futures-util = "0.3"
squashfs_reader = { version = "=0.1.1", default-features = false, features = ["only_rust"] }
tauri-plugin-video = { path = "vendor/tauri-plugin-video", default-features = false, features = ["mpv-runtime"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
dbus = "0.9"
dbus-tokio = "0.7"
dbus-crossroads = "0.5"
libmpv2 = "=5.0.3"
libmpv2-sys = "=4.0.1"

[patch.crates-io]
tauri-runtime-wry = { path = "vendor/tauri-runtime-wry" }
libmpv2 = { path = "vendor/libmpv2" }
