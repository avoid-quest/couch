name: Package
"on":
  workflow_dispatch:
    inputs:
      format:
        type: choice
        options:
          - deb
          - appimage
        default: deb
        description: Package format to build or restore
      channel:
        type: choice
        options:
          - preview
          - stable
        default: preview
        description: Stable restores the identical final-version Preview bytes
      build-run:
        type: number
        default: 0
        description: "Reuse signed receipts from this Package run, 0 builds once"
      build-attempt:
        type: number
        default: 1
        description: Attempt that produced the retained artifact
      release-id:
        type: string
        description: "Recorded draft ID; attach AppImage to a Debian draft or match a retry"
      readiness-only:
        type: boolean
        default: false
        description: "Recheck CDN readiness without drafting, building or publishing"
      publish:
        type: boolean
        default: false
        description: Publish the qualified draft; false only uploads it
permissions:
  contents: read
concurrency:
  group: couch-hosted-release
  cancel-in-progress: false
env:
  COUCH_UPDATER_PUBLIC_KEY: "${{ vars.COUCH_UPDATER_PUBLIC_KEY }}"
jobs:
  release:
    if: "${{ vars.COUCH_RELEASES_ENABLED == 'true' && github.ref == 'refs/heads/main' }}"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: couch-release
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Install receipt verifier
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
      - name: Download retained receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        id: receipts
        if: inputs.build-run > 0
        continue-on-error: true
        with:
          name: "release-receipts-${{ inputs.build-run }}.${{ inputs.build-attempt }}"
          run-id: "${{ inputs.build-run }}"
          github-token: "${{ github.token }}"
          path: .artifacts/hosted-release
      - name: Restore signed receipts from the original run log when artifact storage was unavailable
        if: inputs.build-run > 0 && steps.receipts.outcome == 'failure'
        env:
          GH_TOKEN: "${{ github.token }}"
          BUILD_RUN: "${{ inputs.build-run }}"
          BUILD_ATTEMPT: "${{ inputs.build-attempt }}"
        run: |
          mkdir -p .artifacts/hosted-release
          gh run view "$BUILD_RUN" --attempt "$BUILD_ATTEMPT" --log --repo "$GITHUB_REPOSITORY" > .artifacts/receipt-run.log
          bun scripts/hosted-receipts.ts restore .artifacts/receipt-run.log .artifacts/hosted-release
      - name: Check the candidate inputs
        env:
          BUILD_RUN: "${{ inputs.build-run }}"
          BUILD_ATTEMPT: "${{ inputs.build-attempt }}"
          CHANNEL: "${{ inputs.channel }}"
          FORMAT: "${{ inputs.format }}"
          PUBLISH: "${{ inputs.publish }}"
          READINESS_ONLY: "${{ inputs.readiness-only }}"
          GH_TOKEN: "${{ github.token }}"
        run: |
          mkdir -p .artifacts/hosted-release
          if [ "$CHANNEL" = preview ]; then test "$PUBLISH" = false || exit 1; fi
          if [ "$FORMAT" = appimage ]; then test "$CHANNEL" = preview && test "$PUBLISH" = false || exit 1; fi
          if [ "$BUILD_RUN" = 0 ]; then
            test "$CHANNEL" = preview && test "$READINESS_ONLY" = false
            case "$FORMAT" in deb|appimage) ;; *) exit 1 ;; esac
            revision=$(git rev-parse HEAD)
          else
            bun scripts/hosted-release.ts verify-receipt .artifacts/hosted-release
            revision=$(jq -er .revision .artifacts/hosted-release/manifest.json)
            test "$(jq -r '.format' .artifacts/hosted-release/manifest.json)" = "$FORMAT"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN/attempts/$BUILD_ATTEMPT" > .artifacts/receipt-run.json
            source_run=$(jq -er '.buildRun.id' .artifacts/hosted-release/manifest.json)
            source_attempt=$(jq -er '.buildRun.attempt' .artifacts/hosted-release/manifest.json)
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_run/attempts/$source_attempt" > .artifacts/source-run.json
            for receipt in .artifacts/receipt-run.json .artifacts/source-run.json; do
              jq -e '.path == ".github/workflows/package.yml" and .event == "workflow_dispatch" and .head_branch == "main"' "$receipt"
            done
            test "$(jq -r .revision .artifacts/hosted-release/manifest.json)" = "$(jq -r .head_sha .artifacts/source-run.json)"
          fi
          bun scripts/release-notes.ts "$revision" > .artifacts/hosted-release/notes.md
      - name: Install supported Cloud CLI
        if: "${{ !inputs.readiness-only }}"
        uses: crabnebula-dev/cloud-release@1a8803698ba41de6b23e42abc5dcc3721308233c
        with:
          command: version
          api-key: "${{ secrets.CN_API_KEY }}"
          path: .artifacts
      - name: Restore the exact published Preview for Stable
        if: "inputs.build-run > 0 && inputs.channel == 'stable' && !inputs.readiness-only"
        run: bun scripts/hosted-release.ts restore .artifacts/hosted-release
      - name: Select the qualified draft
        id: draft
        if: "${{ !inputs.readiness-only }}"
        env:
          CN_API_KEY: "${{ secrets.CN_API_KEY }}"
          CN_BIN: "${{ github.workspace }}/.artifacts/cn"
          BUILD_RUN: "${{ inputs.build-run }}"
          CHANNEL: "${{ inputs.channel }}"
          COUCH_PACKAGE_FORMAT: "${{ inputs.format }}"
          RELEASE_ID: "${{ inputs.release-id }}"
        run: |
          operation=draft-source
          if [ "$BUILD_RUN" != 0 ]; then
            if [ "$CHANNEL" = stable ]; then operation=draft; else operation=resume; fi
          fi
          bun scripts/hosted-release.ts "$operation" .artifacts/hosted-release "$CHANNEL" "$RELEASE_ID"
      - name: Read the pinned Debian builder inputs
        id: builder-inputs
        if: inputs.build-run == 0
        run: |
          echo "debian-image=$(bun -p '(await Bun.file("packaging/inputs.json").json()).debianImage')" >> "$GITHUB_OUTPUT"
          echo "debian-snapshot=$(bun -p '(await Bun.file("packaging/inputs.json").json()).debianSnapshot')" >> "$GITHUB_OUTPUT"
          echo "bun-version=$(bun -p '(await Bun.file("package.json").json()).packageManager.split("@")[1]')" >> "$GITHUB_OUTPUT"
          echo "rust-version=$(bun -p 'Bun.TOML.parse(await Bun.file("rust-toolchain.toml").text()).toolchain.channel')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        if: inputs.build-run == 0
      - name: Prepare the pinned Debian builder
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        if: inputs.build-run == 0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: packaging
          file: packaging/Dockerfile.builder
          platforms: linux/amd64
          tags: couch-release-builder
          load: true
          push: false
          build-args: |
            DEBIAN_IMAGE=${{ steps.builder-inputs.outputs.debian-image }}
            DEBIAN_SNAPSHOT=${{ steps.builder-inputs.outputs.debian-snapshot }}
            BUN_VERSION=${{ steps.builder-inputs.outputs.bun-version }}
            RUST_VERSION=${{ steps.builder-inputs.outputs.rust-version }}
          cache-from: "type=gha,version=2,scope=couch-debian-builder-amd64"
          cache-to: "type=gha,version=2,scope=couch-debian-builder-amd64,mode=min,ignore-error=true"
      - name: Start the pinned Debian builder
        if: inputs.build-run == 0
        run: |
          docker create --name couch-build --init --cpus 4 --memory 10g couch-release-builder
          docker start couch-build
          git bundle create /tmp/source.bundle HEAD
          docker cp /tmp/source.bundle couch-build:/source.bundle
          docker exec couch-build git clone /source.bundle /work
          docker exec -w /work couch-build git checkout --detach "$(git rev-parse HEAD)"
          rustup show active-toolchain
          mkdir -p src-tauri/target "$HOME/.cargo/registry" "$HOME/.cargo/git" .artifacts/cache/bun
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        if: inputs.build-run == 0
        with:
          workspaces: src-tauri
          cache-bin: false
          cache-on-failure: true
          key: "debian-13-release-${{ hashFiles('packaging/inputs.json', 'bun.lock') }}"
          cache-directories: .artifacts/cache/bun
      - name: Restore compiler and dependency caches
        if: inputs.build-run == 0
        run: |
          docker exec couch-build mkdir -p /work/src-tauri/target /root/.cargo/registry /root/.cargo/git /root/.bun/install/cache
          docker cp src-tauri/target/. couch-build:/work/src-tauri/target
          docker cp "$HOME/.cargo/registry/." couch-build:/root/.cargo/registry
          docker cp "$HOME/.cargo/git/." couch-build:/root/.cargo/git
          docker cp .artifacts/cache/bun/. couch-build:/root/.bun/install/cache
      - name: Build and sign the selected package
        if: inputs.build-run == 0
        env:
          TAURI_SIGNING_PRIVATE_KEY: "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"
        run: |
          docker exec -w /work -e COUCH_UPDATER_PUBLIC_KEY -e TAURI_SIGNING_PRIVATE_KEY -e TAURI_SIGNING_PRIVATE_KEY_PASSWORD -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT couch-build bash scripts/hosted-build.sh "${{ inputs.format }}"
      - name: Qualify the exact signed bytes
        if: inputs.build-run == 0
        run: |
          docker exec -w /work couch-build bash scripts/hosted-qualify.sh "${{ inputs.format }}"
          mkdir -p .artifacts/native-qualification
          bash scripts/hosted-desktop.sh couch-build .artifacts/native-qualification "${{ inputs.format }}"
          docker exec -w /work couch-build bun scripts/hosted-release.ts qualify .artifacts/hosted-release
      - name: Sign the qualification receipt
        if: inputs.build-run == 0
        env:
          TAURI_SIGNING_PRIVATE_KEY: "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"
        run: docker exec -w /work -e TAURI_SIGNING_PRIVATE_KEY -e TAURI_SIGNING_PRIVATE_KEY_PASSWORD couch-build bun x --no-install tauri signer sign .artifacts/hosted-release/qualified.json
      - name: Copy the qualified candidate for direct upload
        if: inputs.build-run == 0
        run: |
          docker cp couch-build:/work/.artifacts/hosted-release/. .artifacts/hosted-release/
          bun scripts/hosted-release.ts verify .artifacts/hosted-release
      - name: Upload only qualified files directly to CrabNebula
        if: "!inputs.readiness-only && (inputs.build-run == 0 || inputs.channel == 'stable')"
        env:
          CN_API_KEY: "${{ secrets.CN_API_KEY }}"
          CN_BIN: "${{ github.workspace }}/.artifacts/cn"
          CHANNEL: "${{ inputs.channel }}"
          RELEASE_ID: "${{ steps.draft.outputs.release-id }}"
        run: |
          # Retry transport while the exact signed bytes remain on this runner.
          for attempt in 1 2 3; do
            if bun scripts/hosted-release.ts upload .artifacts/hosted-release "$CHANNEL" "$RELEASE_ID"; then exit 0; fi
            test "$attempt" != 3
            sleep 10
          done
      - name: Publish the complete qualified release
        if: inputs.publish && !inputs.readiness-only
        env:
          CN_API_KEY: "${{ secrets.CN_API_KEY }}"
          CN_BIN: "${{ github.workspace }}/.artifacts/cn"
          CHANNEL: "${{ inputs.channel }}"
          RELEASE_ID: "${{ steps.draft.outputs.release-id }}"
        run: "bun scripts/hosted-release.ts publish .artifacts/hosted-release \"$CHANNEL\" \"$RELEASE_ID\""
      - name: Verify public downloads and updater metadata
        if: inputs.publish || inputs.readiness-only
        env:
          CHANNEL: "${{ inputs.channel }}"
        run: "bun scripts/hosted-release.ts readiness .artifacts/hosted-release \"$CHANNEL\""
      - name: Mirror the published version to GitHub Releases
        env:
          GH_TOKEN: "${{ github.token }}"
          CHANNEL: "${{ inputs.channel }}"
        run: |
          receipt=".artifacts/hosted-release/receipts/publish-$CHANNEL.json"
          test -f "$receipt" || { echo "No publish receipt for $CHANNEL; nothing to mirror."; exit 0; }
          bun scripts/hosted-release.ts github-release .artifacts/hosted-release "$CHANNEL"
      - name: Retain compiler and dependency caches after any build outcome
        if: "${{ always() && inputs.build-run == 0 }}"
        run: |
          if docker container inspect couch-build > /dev/null 2>&1; then
            mkdir -p src-tauri/target "$HOME/.cargo/registry" "$HOME/.cargo/git" .artifacts/cache/bun
            copy_cache() { docker cp "couch-build:$1/." "$2/" || echo "::warning::Could not retain cache $1"; }
            copy_cache /work/src-tauri/target src-tauri/target
            copy_cache /root/.cargo/registry "$HOME/.cargo/registry"
            copy_cache /root/.cargo/git "$HOME/.cargo/git"
            copy_cache /root/.bun/install/cache .artifacts/cache/bun
          fi
      - name: Retain small signed receipts after any outcome
        if: "${{ always() && inputs.build-run == 0 }}"
        run: |
          mkdir -p .artifacts/hosted-release
          if docker container inspect couch-build > /dev/null 2>&1; then
            for file in manifest.json manifest.json.sig qualified.json qualified.json.sig; do
              docker cp "couch-build:/work/.artifacts/hosted-release/$file" ".artifacts/hosted-release/$file" 2>/dev/null || true
            done
          fi
      - name: Stop the builder
        if: "${{ always() && inputs.build-run == 0 }}"
        run: |
          if docker container inspect couch-build > /dev/null 2>&1; then docker stop couch-build; fi
      - name: Keep signed receipts in the run log if artifact storage is unavailable
        if: always()
        continue-on-error: true
        run: bun scripts/hosted-receipts.ts export .artifacts/hosted-release
      - name: Retain receipts without blocking publication on artifact quota
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        continue-on-error: true
        with:
          name: "release-receipts-${{ github.run_id }}.${{ github.run_attempt }}"
          path: |
            .artifacts/hosted-release/manifest.json
            .artifacts/hosted-release/manifest.json.sig
            .artifacts/hosted-release/qualified.json
            .artifacts/hosted-release/qualified.json.sig
            .artifacts/hosted-release/draft-*.json
            .artifacts/hosted-release/readiness-*.json
            .artifacts/hosted-release/receipts/*.json
          if-no-files-found: warn
          retention-days: 90
