name: Package

# Repository Actions is paused. An owner must separately enable an authorized run.
on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [preview, stable]
        default: preview
        description: Stable requires the qualified final-version Preview artifact
      build-run:
        type: number
        default: 0
        description: Reuse this Package run's retained artifact, 0 builds once
      build-attempt:
        type: number
        default: 1
        description: Attempt that produced the retained artifact
      artifact-kind:
        type: choice
        options: [hosted-release, hosted-ready]
        default: hosted-release
        description: Use hosted-ready for Stable promotion
      release-id:
        type: string
        description: Existing draft ID for a retry, or published ID for readiness-only
      readiness-only:
        type: boolean
        default: false
        description: Recheck CDN readiness without drafting, building or publishing
      publish:
        type: boolean
        default: false
        description: Request publication after qualification and protected-environment approval
      notes:
        type: string
        required: true
        description: Release notes

permissions:
  contents: read

concurrency:
  group: couch-hosted-release
  cancel-in-progress: false

env:
  COUCH_UPDATER_PUBLIC_KEY: ${{ vars.COUCH_UPDATER_PUBLIC_KEY }}

jobs:
  draft:
    if: ${{ vars.COUCH_RELEASES_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: couch-release
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      release-id: ${{ steps.draft.outputs.release-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Validate retained run provenance
        if: inputs.build-run > 0
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build-run }}
          BUILD_ATTEMPT: ${{ inputs.build-attempt }}
        run: |
          mkdir -p .artifacts
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN/attempts/$BUILD_ATTEMPT" > .artifacts/run.json
          jq -e '.path == ".github/workflows/package.yml" and .event == "workflow_dispatch" and .head_branch == "main"' .artifacts/run.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: inputs.build-run > 0
        with:
          name: ${{ inputs.artifact-kind }}-${{ inputs.build-run }}.${{ inputs.build-attempt }}
          run-id: ${{ inputs.build-run }}
          github-token: ${{ github.token }}
          path: .artifacts/hosted-release
      - name: Check the candidate inputs
        env:
          NOTES: ${{ inputs.notes }}
          BUILD_RUN: ${{ inputs.build-run }}
          CHANNEL: ${{ inputs.channel }}
          READINESS_ONLY: ${{ inputs.readiness-only }}
        run: |
          mkdir -p .artifacts/hosted-release
          printf '%s\n' "$NOTES" > .artifacts/hosted-release/notes.md
          if [ "$BUILD_RUN" != 0 ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
            bun scripts/hosted-release.ts verify .artifacts/hosted-release
            test "$(jq -r .revision .artifacts/hosted-release/manifest.json)" = "$(jq -r .head_sha .artifacts/run.json)"
          else
            test "$CHANNEL" = preview && test "$READINESS_ONLY" = false
          fi
      - name: Install supported Cloud CLI
        if: ${{ !inputs.readiness-only }}
        uses: crabnebula-dev/cloud-release@1a8803698ba41de6b23e42abc5dcc3721308233c # v0
        with:
          command: version
          api-key: ${{ secrets.CN_API_KEY }}
          path: .artifacts
      - name: Draft the effective Tauri version or retained promotion
        id: draft
        if: ${{ !inputs.readiness-only }}
        env:
          CN_API_KEY: ${{ secrets.CN_API_KEY }}
          CN_BIN: ${{ github.workspace }}/.artifacts/cn
          BUILD_RUN: ${{ inputs.build-run }}
          CHANNEL: ${{ inputs.channel }}
          RELEASE_ID: ${{ inputs.release-id }}
        run: |
          operation=draft
          if [ "$BUILD_RUN" = 0 ]; then operation=draft-source; fi
          bun scripts/hosted-release.ts "$operation" .artifacts/hosted-release "$CHANNEL" "$RELEASE_ID"

  candidate:
    needs: draft
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: couch-release
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: inputs.build-run > 0
        with:
          name: ${{ inputs.artifact-kind }}-${{ inputs.build-run }}.${{ inputs.build-attempt }}
          run-id: ${{ inputs.build-run }}
          github-token: ${{ github.token }}
          path: .artifacts/hosted-release
      - name: Prepare the pinned Debian builder
        if: inputs.build-run == 0
        run: |
          docker build --platform linux/amd64 -f packaging/Dockerfile.mac \
            --build-arg "DEBIAN_IMAGE=$(bun -p '(await Bun.file("packaging/inputs.json").json()).debianImage')" \
            --build-arg "DEBIAN_SNAPSHOT=$(bun -p '(await Bun.file("packaging/inputs.json").json()).debianSnapshot')" \
            --build-arg "BUN_VERSION=$(bun -p '(await Bun.file("package.json").json()).packageManager.split("@")[1]')" \
            --build-arg "RUST_VERSION=$(bun -p 'Bun.TOML.parse(await Bun.file("rust-toolchain.toml").text()).toolchain.channel')" \
            -t couch-release-builder packaging
          docker create --name couch-build --init --cpus 4 --memory 10g couch-release-builder
          docker start couch-build
          git bundle create /tmp/source.bundle HEAD
          docker cp /tmp/source.bundle couch-build:/source.bundle
          docker exec couch-build git clone /source.bundle /work
          docker exec -w /work couch-build git checkout --detach "$GITHUB_SHA"
          # Keep caches on runner paths for the supported cache action, never in public assets.
          mkdir -p .artifacts/cache/target .artifacts/cache/registry .artifacts/cache/git .artifacts/cache/bun
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: inputs.build-run == 0
        with:
          path: .artifacts/cache
          key: debian-13-release-${{ runner.arch }}-${{ hashFiles('packaging/inputs.json', 'rust-toolchain.toml', 'src-tauri/Cargo.lock', 'bun.lock') }}
      - name: Restore compiler and dependency caches
        if: inputs.build-run == 0
        run: |
          docker exec couch-build mkdir -p /work/src-tauri/target /root/.cargo/registry /root/.cargo/git /root/.bun/install/cache
          docker cp .artifacts/cache/target/. couch-build:/work/src-tauri/target
          docker cp .artifacts/cache/registry/. couch-build:/root/.cargo/registry
          docker cp .artifacts/cache/git/. couch-build:/root/.cargo/git
          docker cp .artifacts/cache/bun/. couch-build:/root/.bun/install/cache
      - name: Build and sign the complete AppImage and public archives
        if: inputs.build-run == 0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          docker exec -w /work -e COUCH_UPDATER_PUBLIC_KEY -e TAURI_SIGNING_PRIVATE_KEY -e TAURI_SIGNING_PRIVATE_KEY_PASSWORD couch-build bash scripts/hosted-build.sh
      - name: Qualify the exact signed bytes
        if: inputs.build-run == 0
        run: |
          docker exec -w /work couch-build bash scripts/hosted-qualify.sh
          docker run --rm --platform linux/amd64 -v "$PWD:/repo:ro" -w /repo couch-release-builder bash tests/package/installer.sh
          docker exec -w /work couch-build bun -e 'const p=".artifacts/hosted-release/qualified.json"; const q=await Bun.file(p).json(); q.checks.push("installer"); await Bun.write(p,JSON.stringify(q,null,2))'
      - name: Retain build bytes, receipts and caches
        if: ${{ always() && inputs.build-run == 0 }}
        run: |
          mkdir -p .artifacts/hosted-release
          docker cp couch-build:/work/.artifacts/hosted-release/. .artifacts/hosted-release/
          docker cp couch-build:/work/.artifacts/appimage-inventory.json .artifacts/hosted-release/inventory.json
          docker cp couch-build:/work/src-tauri/target/. .artifacts/cache/target/
          docker cp couch-build:/root/.cargo/registry/. .artifacts/cache/registry/
          docker cp couch-build:/root/.cargo/git/. .artifacts/cache/git/
          docker cp couch-build:/root/.bun/install/cache/. .artifacts/cache/bun/
      - name: Stop the builder
        if: ${{ always() && inputs.build-run == 0 }}
        run: docker stop couch-build
      - name: Verify retained candidate
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
          bun scripts/hosted-release.ts verify .artifacts/hosted-release
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: hosted-release-${{ github.run_id }}.${{ github.run_attempt }}
          path: .artifacts/hosted-release/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  upload:
    needs: [draft, candidate]
    if: ${{ !inputs.readiness-only }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: couch-release
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hosted-release-${{ github.run_id }}.${{ github.run_attempt }}
          path: .artifacts/hosted-release
      - uses: crabnebula-dev/cloud-release@1a8803698ba41de6b23e42abc5dcc3721308233c # v0
        with:
          command: version
          api-key: ${{ secrets.CN_API_KEY }}
          path: .artifacts
      - name: Upload only the qualified allowlist and inspect Cloud
        env:
          CN_API_KEY: ${{ secrets.CN_API_KEY }}
          CN_BIN: ${{ github.workspace }}/.artifacts/cn
          CHANNEL: ${{ inputs.channel }}
          RELEASE_ID: ${{ needs.draft.outputs.release-id }}
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
          bun scripts/hosted-release.ts upload .artifacts/hosted-release "$CHANNEL" "$RELEASE_ID"

  publish:
    needs: [draft, candidate, upload]
    if: ${{ inputs.publish && !inputs.readiness-only }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: couch-publication
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hosted-release-${{ github.run_id }}.${{ github.run_attempt }}
          path: .artifacts/hosted-release
      - uses: crabnebula-dev/cloud-release@1a8803698ba41de6b23e42abc5dcc3721308233c # v0
        with:
          command: version
          api-key: ${{ secrets.CN_API_KEY }}
          path: .artifacts
      - name: Publish the complete qualified release
        env:
          CN_API_KEY: ${{ secrets.CN_API_KEY }}
          CN_BIN: ${{ github.workspace }}/.artifacts/cn
          CHANNEL: ${{ inputs.channel }}
          RELEASE_ID: ${{ needs.draft.outputs.release-id }}
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
          bun scripts/hosted-release.ts publish .artifacts/hosted-release "$CHANNEL" "$RELEASE_ID"

  readiness:
    needs: [draft, candidate, publish]
    if: ${{ always() && needs.candidate.result == 'success' && (needs.publish.result == 'success' || inputs.readiness-only) }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hosted-release-${{ github.run_id }}.${{ github.run_attempt }}
          path: .artifacts/hosted-release
      - name: Verify every public file and the installer/updater endpoints
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
          bun scripts/hosted-release.ts readiness .artifacts/hosted-release "$CHANNEL"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hosted-ready-${{ github.run_id }}.${{ github.run_attempt }}
          path: .artifacts/hosted-release/
          compression-level: 0
          retention-days: 7
