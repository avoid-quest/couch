name: Package

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes for this build
        required: true
        type: string
  push:
    # main is the Preview integration branch.
    branches: [main]
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  ubuntu-deb:
    if: github.event_name != 'pull_request' || github.event.label.name == 'qualify-package'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COUCH_RELEASE_ID: ${{ github.run_id }}.${{ github.run_attempt }}
      COUCH_RELEASE_NOTES: ${{ inputs.notes }}
    concurrency:
      group: package-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install build libraries from the reviewed Ubuntu snapshot
        run: |
          snapshot=$(bun -e 'console.log((await Bun.file("packaging/inputs.json").json()).ubuntuSnapshot)')
          sudo apt-get update --snapshot "$snapshot"
          sudo apt-get install -y --no-install-recommends --snapshot "$snapshot" libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libmpv-dev libgl-dev ffmpeg unzip libfuse2t64 librsvg2-dev
          pkg-config --variable=libdir librsvg-2.0
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
          cache-bin: false
          # Keep compiled dependencies when a later runtime qualification fails.
          cache-on-failure: true
          key: ubuntu-24.04-release-deb-${{ hashFiles('packaging/inputs.json', 'src-tauri/vendor/**') }}
      - run: bun install --frozen-lockfile
      - run: bun run package:prepare
      - name: Build the native TV, Debian package and AppImage
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        with:
          tauriScript: bun scripts/desktop.ts
          args: --verbose --bundles deb,appimage --config .artifacts/tauri-release.conf.json -- --locked
      - name: Preserve the exact artifact and matching source
        if: success() || failure() && hashFiles('src-tauri/build-info.json') != ''
        run: |
          mkdir -p .artifacts/package-release
          find src-tauri/target/release/bundle -maxdepth 2 -type f -name '*.deb' -exec cp {} .artifacts/package-release/ \;
          cp src-tauri/build-info.json src-tauri/resources/build-inputs.json .artifacts/package-release/
          git archive --format=tar.gz --output=.artifacts/package-release/couch-source.tar.gz HEAD
          find .artifacts/package-release -name '*.deb' -printf '%p %s bytes\n' > .artifacts/package-release/size.txt
          cd .artifacts/package-release
          find . -maxdepth 1 -type f ! -name SHA256SUMS -exec sha256sum {} \; > SHA256SUMS
      - name: Install the official qualification driver
        run: cargo install tauri-driver --version 2.0.6 --locked
      - name: Qualify the exact Debian package on clean Ubuntu
        run: bun tests/package/qualify.ts .artifacts/package-release/*.deb
      - name: Qualify the exact AppImage on clean Ubuntu
        run: bun tests/package/qualify.ts src-tauri/target/release/bundle/appimage/*.AppImage
      - name: Preserve the qualified AppImage and evidence
        run: |
          mkdir -p .artifacts/qualified-appimage
          cp src-tauri/target/release/bundle/appimage/*.AppImage .artifacts/qualified-appimage/
          cp -r .artifacts/appimage-qualification .artifacts/qualified-appimage/
          cp .artifacts/package-release/couch-source.tar.gz src-tauri/build-info.json .artifacts/qualified-appimage/
          cd .artifacts/qualified-appimage
          sha256sum *.AppImage *.json *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: couch-appimage-${{ github.run_id }}.${{ github.run_attempt }}
          path: .artifacts/qualified-appimage/
          if-no-files-found: error
          retention-days: 90
      - name: Assemble the qualified release and matching appliance package
        run: bun scripts/package-release.ts
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: couch-release-${{ github.run_id }}.${{ github.run_attempt }}
          path: .artifacts/qualified-release/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: couch-qualification-${{ github.run_id }}.${{ github.run_attempt }}
          path: |
            .artifacts/package-release/
            .artifacts/package-qualification/
            .artifacts/appimage-qualification/
          if-no-files-found: error
          retention-days: 30
