name: Package

# Builds the app's installers and update files with electron-builder. Release
# calls it with the version to build and uploads them to that version's draft
# release; a manual dispatch builds package.json's version as run artifacts,
# for test builds that are never published. A -preview.N version builds Couch
# Preview (scripts/package.ts). Mac and Windows run on Blacksmith, like Linux.
"on":
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: The version to build, set in package.json for this build only
        required: true
        type: string
      ref:
        description: The commit to build
        required: true
        type: string
      release:
        description: The draft release in this repository to upload to
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runs-on: blacksmith-4vcpu-ubuntu-2404
            targets: --linux AppImage deb --x64
          # The zip is what Squirrel.Mac updates the app from. A release
          # without its signature would lose every user's permissions.
          - name: mac
            runs-on: blacksmith-6vcpu-macos-26
            targets: --mac dmg zip --arm64 -c.forceCodeSigning=true
          - name: windows
            runs-on: blacksmith-4vcpu-windows-2025
            targets: --win nsis --x64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Release passes the commit preflight chose: for production, the latest
      # preview's rather than this run's. (A `ref` on checkout would stop act
      # from using the local tree.)
      - if: inputs.ref
        shell: bash
        run: git fetch --depth=1 origin "${{ inputs.ref }}" && git checkout --detach FETCH_HEAD
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.2
          cache-dependency-path: native/live-relay/go.sum
      - run: bun install --frozen-lockfile
      # AirPlay and native Live playback link these system libraries on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends cmake pkg-config libssl-dev libplist-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpulse-dev
      - run: go test -v ./...
        working-directory: native/live-relay
      - if: inputs.version
        run: bun pm pkg set version=${{ inputs.version }}
      # The Mac app is signed with Couch's own certificate (docs/ci.md), which
      # codesign uses only once this machine trusts it for code signing.
      - if: runner.os == 'macOS'
        run: sudo security add-trusted-cert -d -r trustRoot -p codeSign packaging/couch-releases.pem
      - run: bun run package ${{ matrix.targets }}
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
      - if: inputs.release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=()
          for file in .artifacts/app/*.{AppImage,deb,dmg,zip,exe,blockmap,yml}; do
            [[ $file == *builder-debug.yml ]] || files+=("$file")
          done
          gh release upload "${{ inputs.release }}" "${files[@]}" -R "$GITHUB_REPOSITORY" --clobber
      - if: ${{ !inputs.release }}
        uses: actions/upload-artifact@v7
        with:
          name: couch-${{ matrix.name }}
          path: |
            .artifacts/app/*.AppImage
            .artifacts/app/*.deb
            .artifacts/app/*.dmg
            .artifacts/app/*.zip
            .artifacts/app/*.exe
            .artifacts/app/*.blockmap
            .artifacts/app/*.yml
            !.artifacts/app/builder-debug.yml
          if-no-files-found: error
          retention-days: 14
