name: Package desktop Preview
"on":
  workflow_dispatch:
    inputs:
      format:
        type: choice
        options:
          - dmg
          - nsis
        required: true
        description: Native package to build on the Apple Silicon runner
      deb-run:
        type: number
        required: true
        description: Package run that built the Debian Preview draft
      deb-attempt:
        type: number
        default: 1
        description: Original Debian build attempt
      release-id:
        type: string
        required: true
        description: Recorded 26-character Debian Preview draft ID
permissions:
  contents: read
concurrency:
  group: couch-hosted-release
  cancel-in-progress: false
env:
  COUCH_UPDATER_PUBLIC_KEY: "${{ vars.COUCH_UPDATER_PUBLIC_KEY }}"
  COUCH_RELEASES_ENABLED: "${{ vars.COUCH_RELEASES_ENABLED }}"
jobs:
  package:
    if: "${{ vars.COUCH_RELEASES_ENABLED == 'true' && github.ref == 'refs/heads/main' }}"
    runs-on: macos-26
    environment: couch-release
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Install receipt verifier
        run: brew install minisign
      - name: Check the signed Debian draft and source run
        env:
          GH_TOKEN: "${{ github.token }}"
          DEB_RUN: "${{ inputs.deb-run }}"
          DEB_ATTEMPT: "${{ inputs.deb-attempt }}"
          RELEASE_ID: "${{ inputs.release-id }}"
        run: |
          bun scripts/preview-receipt-source.ts deb .artifacts/debian-receipt "$DEB_RUN" "$DEB_ATTEMPT"
          test "$(jq -er .id .artifacts/debian-receipt/draft-preview.json)" = "$RELEASE_ID"
      - name: Install native package tools
        env:
          FORMAT: "${{ inputs.format }}"
        run: |
          case "$FORMAT" in
            dmg) brew install mpv ;;
            nsis)
              brew install cargo-about makensis sevenzip llvm@20
              rustup target add x86_64-pc-windows-msvc
              cargo install --locked --version 0.23.0 cargo-xwin
              echo "COUCH_LLVM_PREFIX=$(brew --prefix llvm@20)" >> "$GITHUB_ENV"
              ;;
            *) exit 1 ;;
          esac
          bun install --frozen-lockfile
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: src-tauri
          cache-bin: false
          cache-on-failure: true
          key: "desktop-preview-${{ inputs.format }}-${{ hashFiles('bun.lock', 'src-tauri/Cargo.lock') }}"
      - name: Build and verify the native package
        env:
          FORMAT: "${{ inputs.format }}"
          TAURI_SIGNING_PRIVATE_KEY: "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"
        run: |
          case "$FORMAT" in
            dmg) bun run package:mac ;;
            nsis) bun run package:windows ;;
            *) exit 1 ;;
          esac
      - name: Seal the verified native bytes and signed receipts
        env:
          FORMAT: "${{ inputs.format }}"
          TAURI_SIGNING_PRIVATE_KEY: "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"
        run: bun scripts/preview-release.ts seal "$FORMAT" ".artifacts/preview/$FORMAT"
      - name: Install supported Cloud CLI
        uses: crabnebula-dev/cloud-release@1a8803698ba41de6b23e42abc5dcc3721308233c
        with:
          command: version
          api-key: "${{ secrets.CN_API_KEY }}"
          path: .artifacts
      - name: Upload only the qualified bytes to the Debian Preview draft
        env:
          FORMAT: "${{ inputs.format }}"
          RELEASE_ID: "${{ inputs.release-id }}"
          CN_API_KEY: "${{ secrets.CN_API_KEY }}"
          CN_BIN: "${{ github.workspace }}/.artifacts/cn"
        run: bun scripts/preview-release.ts upload ".artifacts/preview/$FORMAT" "$RELEASE_ID"
      - name: Keep signed receipts in the run log if artifact storage is unavailable
        if: always()
        continue-on-error: true
        env:
          FORMAT: "${{ inputs.format }}"
        run: bun scripts/hosted-receipts.ts export ".artifacts/preview/$FORMAT"
      - name: Retain small signed receipts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        continue-on-error: true
        with:
          name: "release-receipts-${{ github.run_id }}.${{ github.run_attempt }}"
          path: |
            .artifacts/preview/${{ inputs.format }}/manifest.json
            .artifacts/preview/${{ inputs.format }}/manifest.json.sig
            .artifacts/preview/${{ inputs.format }}/qualified.json
            .artifacts/preview/${{ inputs.format }}/qualified.json.sig
            .artifacts/preview/${{ inputs.format }}/receipts/upload-preview.json
          if-no-files-found: warn
          retention-days: 90
