name: Housekeeping
"on":
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:
permissions:
  actions: write
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete expired artifacts and stale caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Expired artifacts linger in the storage accounting until deleted.
          while :; do
            ids=$(gh api "repos/$GH_REPO/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired) | .id] | if length > 0 then . else empty end | .[]')
            [[ -n $ids ]] || break
            while read -r id; do
              echo "Deleting artifact $id"
              gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$id" -i 2>/dev/null >/dev/null || true
            done <<< "$ids"
          done
          # Caches evict themselves by least recent use only at the quota cap.
          cutoff=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api "repos/$GH_REPO/actions/caches?per_page=100" --paginate \
            --jq "(.actions_caches_cache_list // [])[] | select(.last_accessed_at < \"$cutoff\") | .id" \
            | while read -r id; do
                echo "Deleting cache $id"
                gh api -X DELETE "repos/$GH_REPO/actions/caches/$id" -i 2>/dev/null >/dev/null || true
              done
