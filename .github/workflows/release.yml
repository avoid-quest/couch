name: Release
"on":
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: couch-release-trigger
  cancel-in-progress: false
jobs:
  trigger:
    if: "${{ vars.COUCH_RELEASES_ENABLED == 'true' && github.ref == 'refs/heads/main' }}"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Dispatch the package pipeline when the version is unreleased
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          if ! bun scripts/release-pending.ts; then
            echo "Nothing to release."
            exit 0
          fi
          gh workflow run package.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f channel=preview -f publish=false
