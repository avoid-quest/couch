name: Release

# Publishes Couch in this repository, where the installed app's updater looks.
# Dispatched by hand only: channel preview
# publishes main as vX.Y.Z-preview.N, channel production promotes the latest
# preview's commit to vX.Y.Z. Each release tags the commit that was built.
# See docs/ci.md.
"on":
  workflow_dispatch:
    inputs:
      channel:
        description: Channel
        type: choice
        default: preview
        options: [preview, production]

# One release at a time. A run waiting behind it is replaced by a newer one.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      name: ${{ steps.resolve.outputs.name }}
      ref: ${{ steps.resolve.outputs.ref }}
      previous_tag: ${{ steps.resolve.outputs.previous_tag }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - id: resolve
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel || 'preview' }}
        run: |
          if [[ $GITHUB_REF != refs/heads/main ]]; then
            echo "::error::Releases are cut from main, not $GITHUB_REF"
            exit 1
          fi
          bun scripts/release.ts "$CHANNEL" | tee -a "$GITHUB_OUTPUT"

  # A draft is invisible to the updater. The builds upload into it, so nothing
  # passes through artifact storage, and it is published once all three are in.
  draft:
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    # generate-notes is a POST, so it needs write access to this repository.
    permissions:
      contents: write
    env:
      CHANNEL: ${{ needs.preflight.outputs.channel }}
      TAG: ${{ needs.preflight.outputs.tag }}
      NAME: ${{ needs.preflight.outputs.name }}
      REF: ${{ needs.preflight.outputs.ref }}
      PREVIOUS_TAG: ${{ needs.preflight.outputs.previous_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # GitHub's notes from this repo's merged pull requests since the previous
      # release on the same channel.
      # Every release opens with the one command an unsigned Mac app needs (docs/usage.md).
      - name: Write the notes
        run: |
          app=$([[ $CHANNEL == preview ]] && echo "Couch Preview" || echo Couch)
          cat > notes.md <<EOF
          ## Installing on macOS

          Couch isn't signed by Apple, so the first time macOS says it "is damaged" or "can't be opened". Move $app to Applications, then run this once in Terminal:

          \`\`\`sh
          xattr -dr com.apple.quarantine "/Applications/$app.app"
          \`\`\`

          EOF
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$REF" \
            ${PREVIOUS_TAG:+-f previous_tag_name="$PREVIOUS_TAG"} \
            --jq .body >> notes.md
          cat notes.md
      # A rerun keeps the draft it made before.
      - name: Draft the release
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --target "$REF" \
              --title "$NAME" --notes-file notes.md \
              $([[ $CHANNEL == preview ]] && echo --prerelease)

  package:
    needs: [preflight, draft]
    permissions:
      contents: write
    uses: ./.github/workflows/package.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release: ${{ needs.preflight.outputs.tag }}

  publish:
    needs: [preflight, package]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      CHANNEL: ${{ needs.preflight.outputs.channel }}
      TAG: ${{ needs.preflight.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish the release
        run: |
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false \
            $([[ $CHANNEL == production ]] && echo --latest)
