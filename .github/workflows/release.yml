name: Release
"on":
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        type: boolean
        default: false
        description: Dispatch the package pipeline even when the tag already exists
permissions:
  contents: read
  actions: write
concurrency:
  group: couch-release-trigger
  cancel-in-progress: false
jobs:
  trigger:
    if: "${{ vars.COUCH_RELEASES_ENABLED == 'true' && github.ref == 'refs/heads/main' }}"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Check whether this version is already released
        id: released
        env:
          GH_TOKEN: "${{ github.token }}"
          FORCE: "${{ inputs.force }}"
        run: |
          version=$(jq -r .version package.json)
          if [ "$FORCE" != true ] && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" >/dev/null 2>&1; then
            echo "v$version already has a tag; nothing to release."
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is unreleased."
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Dispatch the package pipeline with the changelog
        if: steps.released.outputs.released == 'false'
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          notes=$(bun scripts/release-notes.ts)
          gh workflow run package.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f channel=preview -f publish=true -f notes="$notes"
