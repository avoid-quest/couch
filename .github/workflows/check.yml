name: Check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  linux:
    # Retargeting a PR changes its merge result; editing its title or body does not.
    if: github.event.action != 'edited' || github.event.changes.base
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && 'PR metadata' || 'linux' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      # Keep assertions and overflow checks without bulky debug symbols.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Resolve the tested base
        id: base
        continue-on-error: true
        env:
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        # Compare the actual PR merge tree to its first parent, or the push's prior tip.
        run: |
          base="${BEFORE:-$(git rev-parse HEAD^1)}"
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4
        id: paths
        if: steps.base.outcome == 'success'
        continue-on-error: true
        with:
          token: ''
          base: ${{ steps.base.outputs.sha }}
          ref: ${{ github.sha }}
          predicate-quantifier: every
          filters: |
            code: &non-docs
              - '!*.md'
              - '!docs/**/*.md'
              - '!tests/{linux,preview}/**/*.md'
            native:
              - *non-docs
              - '{src-tauri/**,rust-toolchain.toml,package.json,bun.lock,scripts/{build,release-version}.ts,.github/workflows/check.yml}'
            appliance:
              - '{install-couch,packaging/appliance/**,scripts/{build-appliance,test-appliance,test-appliance-systemd}.sh,.github/workflows/check.yml}'
            releases:
              - '{scripts/*release*,install-couch,.github/workflows/check.yml,.github/workflows/releases.yml}'
      - uses: oven-sh/setup-bun@v2
        if: steps.paths.outcome != 'success' || steps.paths.outputs.code != 'false'
        with:
          bun-version: 1.4.2
      - name: Install host test dependencies
        if: steps.paths.outcome != 'success' || steps.paths.outputs.code != 'false'
        env:
          RELEASES: ${{ steps.paths.outcome != 'success' || steps.paths.outputs.releases != 'false' }}
          APPLIANCE: ${{ steps.paths.outcome != 'success' || steps.paths.outputs.appliance != 'false' }}
          NATIVE: ${{ steps.paths.outcome != 'success' || steps.paths.outputs.native != 'false' }}
        run: |
          packages=()
          if [[ $RELEASES = true ]] && ! command -v apt-ftparchive >/dev/null; then packages+=(apt-utils); fi
          if [[ $APPLIANCE = true ]]; then
            command -v setfacl >/dev/null || packages+=(acl)
            command -v jq >/dev/null || packages+=(jq)
          fi
          command -v ffmpeg >/dev/null || packages+=(ffmpeg)
          if [[ $NATIVE = true ]]; then
            for package in libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libmpv-dev libgl-dev; do
              [[ $(dpkg-query -W -f='${db:Status-Status}' "$package" 2>/dev/null) = installed ]] || packages+=("$package")
            done
          fi
          if (( ${#packages[@]} )); then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${packages[@]}"
          fi
      - name: Test signed releases
        if: steps.paths.outcome != 'success' || steps.paths.outputs.releases != 'false'
        run: sudo "$(command -v bun)" scripts/test-publish-release.ts
      - name: Test appliance installation and recovery
        if: steps.paths.outcome != 'success' || steps.paths.outputs.appliance != 'false'
        run: |
          sudo bash scripts/test-appliance.sh
          bash scripts/test-appliance-systemd.sh
      - run: bun install --frozen-lockfile
        if: steps.paths.outcome != 'success' || steps.paths.outputs.code != 'false'
      - run: bun run typecheck
        if: steps.paths.outcome != 'success' || steps.paths.outputs.code != 'false'
      # Isolate the real clock from process-wide mocks in the other tests.
      - run: bun test ./tests/linux/iptv-clock.test.ts
        if: steps.paths.outcome != 'success' || steps.paths.outputs.code != 'false'
      - run: bun test --path-ignore-patterns 'tests/linux/iptv-clock.test.ts'
        if: steps.paths.outcome != 'success' || steps.paths.outputs.code != 'false'
      # Tauri's build script requires the generated sidecar for native tests.
      - run: bun run build
        if: steps.paths.outcome != 'success' || steps.paths.outputs.code != 'false'
      - name: Set up Rust
        if: steps.paths.outcome != 'success' || steps.paths.outputs.native != 'false'
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        if: steps.paths.outcome != 'success' || steps.paths.outputs.native != 'false'
        with:
          workspaces: src-tauri
          cache-bin: false
          key: ubuntu-24.04-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
        if: steps.paths.outcome != 'success' || steps.paths.outputs.native != 'false'
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked -p tauri-plugin-video startup_buffer
        if: steps.paths.outcome != 'success' || steps.paths.outputs.native != 'false'
