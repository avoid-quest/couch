name: Check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  linux:
    # Retargeting a PR changes its merge result; editing its title or body does not.
    if: github.event.action != 'edited' || github.event.changes.base
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && 'PR metadata' || 'linux' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Keep the dev/test assertions and overflow checks; omit bulky debug symbols.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve the tested base
        id: base
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          base="$BEFORE"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            read -r base head extra <<< "$(git show -s --format=%P HEAD)"
            [[ "$head" == "$PR_HEAD" && -z "$extra" ]] || exit 1
          fi
          [[ "$base" =~ ^[0-9a-f]{40}$ && "$(git rev-parse --is-shallow-repository)" == false ]] || exit 1
          git cat-file -e "$base^{commit}"
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4
        id: paths
        if: steps.base.outcome == 'success'
        continue-on-error: true
        with:
          token: ''
          base: ${{ steps.base.outputs.sha }}
          ref: ${{ github.sha }}
          predicate-quantifier: every
          filters: |
            code: &non-docs
              - '!*.md'
              - '!docs/**/*.md'
              - '!tests/{linux,preview}/**/*.md'
            native:
              - *non-docs
              - '!{src,tests}/**/*.{ts,tsx,css,html,m3u}'
              - '!{package.json,bun.lock}'
            packages:
              - '{package.json,bun.lock}'
      - uses: oven-sh/setup-bun@v2
        if: steps.paths.outcome != 'success' || steps.paths.outputs.code != 'false'
        with:
          bun-version: 1.4.2
      - name: Compare native package inputs
        id: packages
        if: steps.paths.outputs.native == 'false' && steps.paths.outputs.packages == 'true'
        continue-on-error: true
        env:
          TESTED_BASE: ${{ steps.base.outputs.sha }}
        run: |
          bun --eval '
          import { isDeepStrictEqual } from "node:util";
          const sensitive = name => /^(?:npm:)?(?:@tauri-apps\/|@oven\/bun-|bun(?:@|$))/.test(name);
          const native = (entries = {}) => Object.fromEntries(Object.entries(entries).filter(([name, value]) => sensitive(name) || sensitive(Array.isArray(value) ? value[0] : value)));
          const manifest = value => {
            if (!value || typeof value !== "object" || Array.isArray(value)) throw new Error("Invalid package manifest");
            const { dependencies, devDependencies, ...metadata } = value;
            return { ...metadata, dependencies: native(dependencies), devDependencies: native(devDependencies) };
          };
          const read = (ref, file) => {
            const result = Bun.spawnSync(["git", "show", `${ref}:${file}`]);
            if (result.exitCode !== 0) throw new Error(`Cannot read ${ref}:${file}`);
            return Bun.JSONC.parse(result.stdout.toString());
          };
          const inputs = ref => {
            const lock = read(ref, "bun.lock");
            if (lock.lockfileVersion !== 2 || lock.configVersion !== 1 || Object.keys(lock.workspaces).length !== 1 || !lock.workspaces[""] || !lock.packages) throw new Error("Unsupported Bun lock structure");
            return [manifest(read(ref, "package.json")), { ...lock, workspaces: { "": manifest(lock.workspaces[""]) }, packages: native(lock.packages) }];
          };
          console.log(`native=${!isDeepStrictEqual(inputs(process.env.TESTED_BASE), inputs("HEAD"))}`);
          ' >> "$GITHUB_OUTPUT"
      - name: Install Linux dependencies
        if: steps.paths.outcome != 'success' || steps.paths.outputs.native != 'false' || (steps.paths.outputs.packages == 'true' && steps.packages.outputs.native != 'false')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libmpv-dev libgl-dev ffmpeg
      - name: Set up Rust
        if: steps.paths.outcome != 'success' || steps.paths.outputs.native != 'false' || (steps.paths.outputs.packages == 'true' && steps.packages.outputs.native != 'false')
        run: rustup show active-toolchain
      - name: Reuse Cargo dependencies
        if: steps.paths.outcome != 'success' || steps.paths.outputs.native != 'false' || (steps.paths.outputs.packages == 'true' && steps.packages.outputs.native != 'false')
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-bin: false
          # The action also keys compiler/host, Cargo env, manifests, and lockfiles.
          key: ubuntu-24.04-default-test-${{ hashFiles('.github/workflows/check.yml', 'src-tauri/vendor/**', 'src-tauri/build.rs', 'src-tauri/tauri.conf.json', 'src-tauri/capabilities/**', 'src-tauri/icons/**', 'scripts/build.ts') }}
      - name: Install media test dependency
        if: steps.paths.outcome == 'success' && steps.paths.outputs.code == 'true' && steps.paths.outputs.native == 'false' && (steps.paths.outputs.packages != 'true' || steps.packages.outputs.native == 'false')
        run: |
          if ! command -v ffmpeg; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - run: bun install --frozen-lockfile
        if: steps.paths.outcome != 'success' || steps.paths.outputs.code != 'false'
      - name: Check application code
        if: steps.paths.outcome == 'success' && steps.paths.outputs.code == 'true' && steps.paths.outputs.native == 'false' && (steps.paths.outputs.packages != 'true' || steps.packages.outputs.native == 'false')
        run: |
          bun run typecheck
          # Isolate the real clock and its process-wide mocks from the remaining tests.
          set -m
          pids=()
          trap 'for pid in "${pids[@]}"; do kill -KILL -- -"$pid" 2>/dev/null || true; done' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          bun test ./tests/linux/iptv-clock.test.ts & pids+=("$!")
          bun test --path-ignore-patterns 'tests/linux/iptv-clock.test.ts' & pids+=("$!")
          status=0
          for pid in "${pids[@]}"; do
            child_status=0
            wait "$pid" || child_status=$?
            echo "Check process $pid exit: $child_status"
            if ((child_status != 0)); then status=1; fi
          done
          exit "$status"
      - run: bun run build
        if: steps.paths.outcome != 'success' || steps.paths.outputs.code != 'false'
      - name: Check native and application code
        if: steps.paths.outcome != 'success' || steps.paths.outputs.native != 'false' || (steps.paths.outputs.packages == 'true' && steps.packages.outputs.native != 'false')
        run: |
          bun run typecheck
          # Isolate the real clock and its process-wide mocks from the remaining tests.
          set -m
          pids=()
          trap 'for pid in "${pids[@]}"; do kill -KILL -- -"$pid" 2>/dev/null || true; done' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          bun test ./tests/linux/iptv-clock.test.ts & pids+=("$!")
          bun test --path-ignore-patterns 'tests/linux/iptv-clock.test.ts' & pids+=("$!")
          cargo test --manifest-path src-tauri/Cargo.toml --locked --verbose & pids+=("$!")
          status=0
          for pid in "${pids[@]}"; do
            child_status=0
            wait "$pid" || child_status=$?
            echo "Check process $pid exit: $child_status"
            if ((child_status != 0)); then status=1; fi
          done
          exit "$status"
