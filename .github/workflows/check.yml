name: Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check In sync persistence on Core's Node runtime
        run: |
          bun build tests/in-sync-persistence.integration.ts --target=node --outfile=build/in-sync-persistence.integration.mjs
          couch_test_data=$(mktemp -d)
          trap 'rm -rf "$couch_test_data"' EXIT
          COUCH_DATA_DIR="$couch_test_data" COUCH_PORT=0 node --test build/in-sync-persistence.integration.mjs
