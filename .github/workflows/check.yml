name: Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      # Keep assertions and overflow checks without bulky debug symbols.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install host test dependencies
        run: |
          packages=()
          for package in apt-utils acl jq ffmpeg libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libmpv-dev libgl-dev; do
            [[ $(dpkg-query -W -f='${db:Status-Status}' "$package" 2>/dev/null) = installed ]] || packages+=("$package")
          done
          if (( ${#packages[@]} )); then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${packages[@]}"
          fi
      - name: Test signed releases
        run: sudo "$(command -v bun)" scripts/test-publish-release.ts
      - name: Test signed Debian installation and recovery
        run: |
          docker run --rm --platform linux/amd64 -v "$PWD:/repo:ro" -w /repo \
            debian:13-slim@sha256:abc9cb88a5587630d7f915f47b23b0668fe250fbfc6457aa4d52b534c1bbf73f \
            sh -c 'apt-get update && apt-get install -y --no-install-recommends jq minisign procps systemd adduser && bash tests/package/installer.sh'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Isolate the real clock from process-wide mocks in the other tests.
      - run: bun test ./tests/linux/iptv-clock.test.ts
      - run: bun test --path-ignore-patterns 'tests/linux/iptv-clock.test.ts'
      # Tauri's build script requires the generated sidecar for native tests.
      - run: bun run build
      - name: Set up Rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-bin: false
          key: ubuntu-24.04-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked -p tauri-plugin-video startup_buffer
