name: Check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  linux:
    # Retargeting a PR changes its merge result; editing its title or body does not.
    if: github.event.action != 'edited' || github.event.changes.base
    name: ${{ github.event.action == 'edited' && !github.event.changes.base && 'PR metadata' || 'linux' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Keep assertions and overflow checks without bulky debug symbols.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Resolve the tested base
        id: base
        continue-on-error: true
        env:
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        # Compare the actual PR merge tree to its first parent, or the push's prior tip.
        run: |
          base="${BEFORE:-$(git rev-parse HEAD^1)}"
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4
        id: paths
        if: steps.base.outcome == 'success'
        continue-on-error: true
        with:
          token: ''
          base: ${{ steps.base.outputs.sha }}
          ref: ${{ github.sha }}
          predicate-quantifier: every
          filters: |
            code: &non-docs
              - '!*.md'
              - '!docs/**/*.md'
              - '!tests/{linux,preview}/**/*.md'
            native:
              - *non-docs
              - '{src-tauri/**,rust-toolchain.toml,package.json,bun.lock,scripts/{build,release-version}.ts,.github/workflows/check.yml}'
            releases:
              - '{scripts/*release*,install-couch,.github/workflows/check.yml,.github/workflows/releases.yml}'
      - name: Verify private artifact origin and attempt checks
        if: steps.paths.outcome != 'success' || steps.paths.outputs.releases != 'false'
        run: python3 scripts/test-download-release.py
      - name: Test signed releases and installer trust enrollment
        if: steps.paths.outcome != 'success' || steps.paths.outputs.releases != 'false'
        run: sudo python3 scripts/test-publish-release.py
      - uses: oven-sh/setup-bun@v2
        if: steps.paths.outcome != 'success' || steps.paths.outputs.code != 'false'
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
        if: steps.paths.outcome != 'success' || steps.paths.outputs.code != 'false'
      - name: Install media test dependency
        if: steps.paths.outcome != 'success' || steps.paths.outputs.code != 'false'
        run: |
          if ! command -v ffmpeg; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - run: bun run typecheck
        if: steps.paths.outcome != 'success' || steps.paths.outputs.code != 'false'
      # Isolate the real clock from process-wide mocks in the other tests.
      - run: bun test ./tests/linux/iptv-clock.test.ts
        if: steps.paths.outcome != 'success' || steps.paths.outputs.code != 'false'
      - run: bun test --path-ignore-patterns 'tests/linux/iptv-clock.test.ts'
        if: steps.paths.outcome != 'success' || steps.paths.outputs.code != 'false'
      # Tauri's build script requires the generated sidecar for native tests.
      - run: bun run build
        if: steps.paths.outcome != 'success' || steps.paths.outputs.code != 'false'
      - name: Install native dependencies
        if: steps.paths.outcome != 'success' || steps.paths.outputs.native != 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libmpv-dev libgl-dev
      - name: Set up Rust
        if: steps.paths.outcome != 'success' || steps.paths.outputs.native != 'false'
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        if: steps.paths.outcome != 'success' || steps.paths.outputs.native != 'false'
        with:
          workspaces: src-tauri
          cache-bin: false
          key: ubuntu-24.04-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
        if: steps.paths.outcome != 'success' || steps.paths.outputs.native != 'false'
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked -p tauri-plugin-video startup_buffer
        if: steps.paths.outcome != 'success' || steps.paths.outputs.native != 'false'
