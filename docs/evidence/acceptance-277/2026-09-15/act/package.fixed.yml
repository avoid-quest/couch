name: Package

# Repository Actions is paused. An owner must separately enable an authorized run.
on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [preview, stable]
        default: preview
        description: Stable requires the qualified final-version Preview artifact
      build-run:
        type: number
        default: 0
        description: Reuse this Package run's retained artifact, 0 builds once
      build-attempt:
        type: number
        default: 1
        description: Attempt that produced the retained artifact
      artifact-kind:
        type: choice
        options: [hosted-release, hosted-ready]
        default: hosted-release
        description: Use hosted-ready for Stable promotion
      release-id:
        type: string
        description: Existing draft ID for a retry, or published ID for readiness-only
      readiness-only:
        type: boolean
        default: false
        description: Recheck CDN readiness without drafting, building or publishing
      publish:
        type: boolean
        default: false
        description: Request publication after qualification and protected-environment approval
      notes:
        type: string
        required: true
        description: Release notes

permissions:
  contents: read

concurrency:
  group: couch-hosted-release
  cancel-in-progress: false

env:
  COUCH_UPDATER_PUBLIC_KEY: ${{ vars.COUCH_UPDATER_PUBLIC_KEY }}

jobs:
  draft:
    if: ${{ vars.COUCH_RELEASES_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: couch-release
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      release-id: ${{ steps.draft.outputs.release-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Validate retained run provenance
        if: inputs.build-run > 0
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build-run }}
          BUILD_ATTEMPT: ${{ inputs.build-attempt }}
        run: |
          mkdir -p .artifacts
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN/attempts/$BUILD_ATTEMPT" > .artifacts/run.json
          jq -e '.path == ".github/workflows/package.yml" and .event == "workflow_dispatch" and .head_branch == "main"' .artifacts/run.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: inputs.build-run > 0
        with:
          name: ${{ inputs.artifact-kind }}-${{ inputs.build-run }}.${{ inputs.build-attempt }}
          run-id: ${{ inputs.build-run }}
          github-token: ${{ github.token }}
          path: .artifacts/hosted-release
      - name: Check the candidate inputs
        env:
          NOTES: ${{ inputs.notes }}
          BUILD_RUN: ${{ inputs.build-run }}
          CHANNEL: ${{ inputs.channel }}
          READINESS_ONLY: ${{ inputs.readiness-only }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .artifacts/hosted-release
          printf '%s\n' "$NOTES" > .artifacts/hosted-release/notes.md
          if [ "$BUILD_RUN" != 0 ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
            bun scripts/hosted-release.ts verify .artifacts/hosted-release
            source_run=$(jq -er '.buildRun.id' .artifacts/hosted-release/manifest.json)
            source_attempt=$(jq -er '.buildRun.attempt' .artifacts/hosted-release/manifest.json)
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_run/attempts/$source_attempt" > .artifacts/source-run.json
            jq -e '.path == ".github/workflows/package.yml" and .event == "workflow_dispatch" and .head_branch == "main"' .artifacts/source-run.json
            test "$(jq -r .revision .artifacts/hosted-release/manifest.json)" = "$(jq -r .head_sha .artifacts/source-run.json)"
          else
            test "$CHANNEL" = preview && test "$READINESS_ONLY" = false
          fi
      - name: Install supported Cloud CLI
        if: ${{ !inputs.readiness-only }}
        uses: crabnebula-dev/cloud-release@1a8803698ba41de6b23e42abc5dcc3721308233c # v0
        with:
          command: version
          api-key: ${{ secrets.CN_API_KEY }}
          path: .artifacts
      - name: Draft the effective Tauri version or retained promotion
        id: draft
        if: ${{ !inputs.readiness-only }}
        env:
          CN_API_KEY: ${{ secrets.CN_API_KEY }}
          CN_BIN: ${{ github.workspace }}/.artifacts/cn
          BUILD_RUN: ${{ inputs.build-run }}
          CHANNEL: ${{ inputs.channel }}
          RELEASE_ID: ${{ inputs.release-id }}
        run: |
          operation=draft
          if [ "$BUILD_RUN" = 0 ]; then operation=draft-source; fi
          bun scripts/hosted-release.ts "$operation" .artifacts/hosted-release "$CHANNEL" "$RELEASE_ID"

  candidate:
    needs: draft
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: couch-release
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: inputs.build-run > 0
        with:
          name: ${{ inputs.artifact-kind }}-${{ inputs.build-run }}.${{ inputs.build-attempt }}
          run-id: ${{ inputs.build-run }}
          github-token: ${{ github.token }}
          path: .artifacts/hosted-release
      - name: Select the original source and qualification work
        id: qualification
        env:
          BUILD_RUN: ${{ inputs.build-run }}
        run: |
          if [ "$BUILD_RUN" != 0 ] && jq -e --slurpfile manifest .artifacts/hosted-release/manifest.json '
            .version == $manifest[0].version and .revision == $manifest[0].revision and
            .files == $manifest[0].files and
            .checks == ["signatures", "typecheck", "bun", "native", "signed-manifest-extraction", "installer"]
          ' .artifacts/hosted-release/qualified.json > /dev/null 2>&1; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
            if [ "$BUILD_RUN" != 0 ]; then
              revision=$(jq -er .revision .artifacts/hosted-release/manifest.json)
              git fetch origin "$revision"
              git checkout --detach "$revision"
            fi
          fi
      - name: Prepare the pinned Debian builder
        if: steps.qualification.outputs.needed == 'true'
        run: |
          docker build --platform linux/amd64 -f packaging/Dockerfile.mac \
            --build-arg "DEBIAN_IMAGE=$(bun -p '(await Bun.file("packaging/inputs.json").json()).debianImage')" \
            --build-arg "DEBIAN_SNAPSHOT=$(bun -p '(await Bun.file("packaging/inputs.json").json()).debianSnapshot')" \
            --build-arg "BUN_VERSION=$(bun -p '(await Bun.file("package.json").json()).packageManager.split("@")[1]')" \
            --build-arg "RUST_VERSION=$(bun -p 'Bun.TOML.parse(await Bun.file("rust-toolchain.toml").text()).toolchain.channel')" \
            -t couch-release-builder packaging
          docker create --name couch-build --init --cpus 4 --memory 10g couch-release-builder
          docker start couch-build
          git bundle create /tmp/source.bundle HEAD
          docker cp /tmp/source.bundle couch-build:/source.bundle
          docker exec couch-build git clone /source.bundle /work
          docker exec -w /work couch-build git checkout --detach "$(git rev-parse HEAD)"
          rustup show active-toolchain
          mkdir -p src-tauri/target "$HOME/.cargo/registry" "$HOME/.cargo/git" .artifacts/cache/bun
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        if: steps.qualification.outputs.needed == 'true'
        with:
          workspaces: src-tauri
          cache-bin: false
          cache-on-failure: true
          key: debian-13-release-${{ hashFiles('packaging/inputs.json', 'bun.lock') }}
          cache-directories: .artifacts/cache/bun
      - name: Restore compiler and dependency caches
        if: steps.qualification.outputs.needed == 'true'
        run: |
          docker exec couch-build mkdir -p /work/src-tauri/target /root/.cargo/registry /root/.cargo/git /root/.bun/install/cache
          docker cp src-tauri/target/. couch-build:/work/src-tauri/target
          docker cp "$HOME/.cargo/registry/." couch-build:/root/.cargo/registry
          docker cp "$HOME/.cargo/git/." couch-build:/root/.cargo/git
          docker cp .artifacts/cache/bun/. couch-build:/root/.bun/install/cache
      - name: Build and sign the complete AppImage and public archives
        if: inputs.build-run == 0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          docker exec -w /work -e COUCH_UPDATER_PUBLIC_KEY -e TAURI_SIGNING_PRIVATE_KEY -e TAURI_SIGNING_PRIVATE_KEY_PASSWORD -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT couch-build bash scripts/hosted-build.sh
      - name: Prepare retained-byte qualification without rebuilding the AppImage
        if: steps.qualification.outputs.needed == 'true' && inputs.build-run > 0
        run: |
          docker exec couch-build mkdir -p /work/.artifacts/hosted-release
          docker cp .artifacts/hosted-release/. couch-build:/work/.artifacts/hosted-release/
          docker exec -w /work -e COUCH_UPDATER_PUBLIC_KEY couch-build bash -c 'bun install --frozen-lockfile && bun run package:prepare && bun run build'
      - name: Qualify the exact signed bytes
        if: steps.qualification.outputs.needed == 'true'
        run: |
          docker exec -w /work couch-build bash scripts/hosted-qualify.sh
          docker run --rm --platform linux/amd64 -v "$PWD:/repo:ro" -w /repo couch-release-builder bash tests/package/installer.sh
          docker exec -w /work couch-build bun -e 'const manifest=await Bun.file(".artifacts/hosted-release/manifest.json").json(); await Bun.write(".artifacts/hosted-release/qualified.json",JSON.stringify({version:manifest.version,revision:manifest.revision,files:manifest.files,checks:["signatures","typecheck","bun","native","signed-manifest-extraction","installer"]},null,2))'
      - name: Retain compiler and dependency caches after any build outcome
        if: ${{ always() && steps.qualification.outputs.needed == 'true' }}
        run: |
          if docker container inspect couch-build > /dev/null 2>&1; then
            mkdir -p src-tauri/target "$HOME/.cargo/registry" "$HOME/.cargo/git" .artifacts/cache/bun
            copy_cache() { docker cp "couch-build:$1/." "$2/" || echo "::warning::Could not retain cache $1"; }
            copy_cache /work/src-tauri/target src-tauri/target
            copy_cache /root/.cargo/registry "$HOME/.cargo/registry"
            copy_cache /root/.cargo/git "$HOME/.cargo/git"
            copy_cache /root/.bun/install/cache .artifacts/cache/bun
          fi
      - name: Retain build bytes and receipts
        if: ${{ always() && steps.qualification.outputs.needed == 'true' }}
        run: |
          mkdir -p .artifacts/hosted-release
          docker cp couch-build:/work/.artifacts/hosted-release/. .artifacts/hosted-release/
          docker cp couch-build:/work/.artifacts/appimage-inventory.json .artifacts/hosted-release/inventory.json || test -f .artifacts/hosted-release/inventory.json
      - name: Stop the builder
        if: ${{ always() && steps.qualification.outputs.needed == 'true' }}
        run: |
          if docker container inspect couch-build > /dev/null 2>&1; then docker stop couch-build; fi
      - name: Verify retained candidate
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
          bun scripts/hosted-release.ts verify .artifacts/hosted-release
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: hosted-release-${{ github.run_id }}.${{ github.run_attempt }}
          path: .artifacts/hosted-release/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  upload:
    needs: [draft, candidate]
    if: ${{ !inputs.readiness-only }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: couch-release
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hosted-release-${{ github.run_id }}.${{ github.run_attempt }}
          path: .artifacts/hosted-release
      - uses: crabnebula-dev/cloud-release@1a8803698ba41de6b23e42abc5dcc3721308233c # v0
        with:
          command: version
          api-key: ${{ secrets.CN_API_KEY }}
          path: .artifacts
      - name: Upload only the qualified allowlist and inspect Cloud
        env:
          CN_API_KEY: ${{ secrets.CN_API_KEY }}
          CN_BIN: ${{ github.workspace }}/.artifacts/cn
          CHANNEL: ${{ inputs.channel }}
          RELEASE_ID: ${{ needs.draft.outputs.release-id }}
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
          bun scripts/hosted-release.ts upload .artifacts/hosted-release "$CHANNEL" "$RELEASE_ID"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: hosted-upload-${{ github.run_id }}.${{ github.run_attempt }}
          path: .artifacts/hosted-release/receipts/
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: [draft, candidate, upload]
    if: ${{ inputs.publish && !inputs.readiness-only }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: couch-publication
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hosted-release-${{ github.run_id }}.${{ github.run_attempt }}
          path: .artifacts/hosted-release
      - uses: crabnebula-dev/cloud-release@1a8803698ba41de6b23e42abc5dcc3721308233c # v0
        with:
          command: version
          api-key: ${{ secrets.CN_API_KEY }}
          path: .artifacts
      - name: Publish the complete qualified release
        env:
          CN_API_KEY: ${{ secrets.CN_API_KEY }}
          CN_BIN: ${{ github.workspace }}/.artifacts/cn
          CHANNEL: ${{ inputs.channel }}
          RELEASE_ID: ${{ needs.draft.outputs.release-id }}
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
          bun scripts/hosted-release.ts publish .artifacts/hosted-release "$CHANNEL" "$RELEASE_ID"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: hosted-publish-${{ github.run_id }}.${{ github.run_attempt }}
          path: .artifacts/hosted-release/receipts/
          if-no-files-found: warn
          retention-days: 7

  readiness:
    needs: [draft, candidate, publish]
    if: ${{ always() && needs.candidate.result == 'success' && (needs.publish.result == 'success' || inputs.readiness-only) }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hosted-release-${{ github.run_id }}.${{ github.run_attempt }}
          path: .artifacts/hosted-release
      - name: Verify every public file and the installer/updater endpoints
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
          bun scripts/hosted-release.ts readiness .artifacts/hosted-release "$CHANNEL"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hosted-ready-${{ github.run_id }}.${{ github.run_attempt }}
          path: .artifacts/hosted-release/
          compression-level: 0
          retention-days: 7
